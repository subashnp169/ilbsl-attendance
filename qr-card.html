<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ILBSL Meeting - Quick Access Card</title>
<style>
@page{size:A6;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#1c2530;width:148mm;height:105mm;margin:0 auto;overflow:hidden}
.card{width:100%;height:100%;display:flex;align-items:center;padding:16px 20px;gap:20px}
.left{flex:0 0 auto;text-align:center}
.left .qr{background:#f7f5f0;border:2px solid #d7d2c4;border-radius:12px;padding:8px}
.left .qr img{width:120px;height:120px;display:block}
.right{flex:1}
.right .logo{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0b2545,#123a6b);color:#c8952b;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.right h1{font-size:16px;color:#0b2545;margin:0 0 2px;font-weight:800;line-height:1.2}
.right>p{font-size:10px;color:#888;margin:0 0 10px}
.right .steps{list-style:none;padding:0}
.right .steps li{font-size:10px;color:#444;margin:0 0 5px;padding-left:16px;position:relative;line-height:1.3}
.right .steps li::before{content:attr(data-n);position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;background:#0b2545;color:#c8952b;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center}
.right .tags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.right .tags span{font-size:8px;font-weight:600;color:#fff;padding:3px 8px;border-radius:10px}
.t1{background:#1e7a3d}.t2{background:#123a6b}.t3{background:#c8952b}.t4{background:#7b3fa0}
.right .footer{font-size:8px;color:#bbb;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="qr">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://subashnp169.github.io/ilbsl-attendance/&bgcolor=f7f5f0&color=0b2545" alt="QR Code">
    </div>
  </div>
  <div class="right">
    <div class="logo">IL</div>
    <h1>Scan to Access<br>Meeting Portal</h1>
    <p>Leadership, Strategy &amp; Review Meeting</p>
    <ol class="steps">
      <li data-n="1">Scan QR with your phone camera</li>
      <li data-n="2">Mark Attendance / View Schedule</li>
      <li data-n="3">Submit Feedback / View Report</li>
    </ol>
    <div class="tags">
      <span class="t1">Attendance</span>
      <span class="t2">Schedule</span>
      <span class="t3">Feedback</span>
      <span class="t4">Report</span>
    </ol>
    <div class="footer">IT Dept - Infinity Laghubitta</div>
  </div>
</div>
</body>
</html>
